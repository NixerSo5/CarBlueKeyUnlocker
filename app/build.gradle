plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nixer.carunlocker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nixer.carunlocker'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.4'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}
