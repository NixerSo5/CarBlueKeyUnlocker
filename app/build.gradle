plugins {
    id 'com.android.application'
}

// 所有敏感配置只从本机 local.properties 读取（该文件已被 git 忽略）。
// 仓库内不包含任何真实手机号、VIN、设备 ID、车辆 MAC 或钥匙材料。
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
// 公开构建：-PpublicBuild=true 时不读取本机任何敏感配置，产物不含登录参数。
def publicBuild = project.hasProperty('publicBuild') &&
        project.property('publicBuild').toString().equalsIgnoreCase('true')
def cfg = { String key -> publicBuild ? '' : localProps.getProperty(key, '') }

// 登录/取钥匙所需的厂商接口参数（仅本机构建使用）
def saicUuid = cfg('SAIC_UUID')
def saicDeviceId = cfg('SAIC_DEVICE_ID')
def saicVin = cfg('SAIC_VIN')
def saicUserId = cfg('SAIC_USER_ID')
def vcAppKey = cfg('APP_KEY')
def vcAppSecret = cfg('APP_SECRET')
def vcPksk = cfg('PKSK_HEX')
// 荣威官方 App 的 Banma 请求签名私钥，仅用于登录后自动拉取账号车辆列表
def banmaSignKey = cfg('BANMA_SIGN_KEY')

android {
    namespace 'com.nixer.carunlocker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nixer.carunlocker'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '2.0'

        buildConfigField "String", "SAIC_UUID", "\"${saicUuid}\""
        buildConfigField "String", "SAIC_DEVICE_ID", "\"${saicDeviceId}\""
        buildConfigField "String", "SAIC_VIN", "\"${saicVin}\""
        buildConfigField "String", "SAIC_USER_ID", "\"${saicUserId}\""
        buildConfigField "String", "VC_APP_KEY", "\"${vcAppKey}\""
        buildConfigField "String", "VC_APP_SECRET", "\"${vcAppSecret}\""
        buildConfigField "String", "VC_PKSK_HEX", "\"${vcPksk}\""
        buildConfigField "String", "BANMA_SIGN_KEY", "\"${banmaSignKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}

